[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]

[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]
# GCC 15+ defaults to C23, which breaks the bundled Oniguruma C sources (onig_sys).
[env]
CFLAGS = "-std=gnu17"
