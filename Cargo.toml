[package]
name = "silicon_nvim"
version = "0.5.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "silicon"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
nvim-oxi = { version = "0.5.1", features = ["neovim-0-10"]  }
serde = { version = '1.0.209', features = ["derive"] }
serde_json = "1.0"
silicon = { version = '0.5.2', default-features = false, features = ["anyhow"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
thiserror = "1.0.40"
arboard = "3.4.0"
tree-sitter = "0.23"
tree-sitter-highlight = "0.23"
# Optional language parsers - these can be omitted if using only nvim-treesitter
tree-sitter-lua = { version = "0.2", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.23", optional = true }
tree-sitter-bash = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }

[dependencies.syntect]
version = "5.0"
default-features = false
features = ["parsing", "dump-load", "regex-onig"]

[dependencies.image]
version = "0.24"
default-features = false
features = ["jpeg", "png", "jpeg_rayon"]

[features]
default = ["builtin-parsers"]
builtin-parsers = [
    "tree-sitter-lua",
    "tree-sitter-rust", 
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-json",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-go"
]
nvim-treesitter-only = []

[patch.crates-io]
# nvim-oxi = { git = "https://github.com/noib3/nvim-oxi", rev = "51dd4734" }
silicon = { git = "https://github.com/Aloxaf/silicon", rev = "7837ec85" }