[package]
name = "silicon_nvim"
version = "0.5.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "silicon"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
nvim-oxi = { version = "0.5.1", features = ["neovim-0-10"]  }
serde = { version = '1.0.209', features = ["derive"] }
serde_json = "1.0"
silicon = { version = '0.5.2', default-features = false, features = ["anyhow"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
thiserror = "1.0.40"
arboard = "3.4.0"
tree-sitter = "0.23"
tree-sitter-highlight = "0.23"
tree-sitter-lua = "0.2"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"

[dependencies.syntect]
version = "5.0"
default-features = false
features = ["parsing", "dump-load", "regex-onig"]

[dependencies.image]
version = "0.24"
default-features = false
features = ["jpeg", "png", "jpeg_rayon"]

[patch.crates-io]
# nvim-oxi = { git = "https://github.com/noib3/nvim-oxi", rev = "51dd4734" }
silicon = { git = "https://github.com/Aloxaf/silicon", rev = "7837ec85" }